<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeonFrame Zentrale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Vollbild 3D-Büro (holografisch blau), schwebende Mitarbeiter-Karte rechts bzw. Bottom-Sheet auf dem Handy. Bewusst nur dunkel. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f4f7fb; --line:#e3e8f0; --line-2:#d9e0ea;
  --fg:#0f1726; --muted:#6b7a93; --accent:#2f6bff; --on-accent:#ffffff;
  --ok:#16b871; --warn:#f59e0b; --frame:#3aa8ff;
  --glass:rgba(255,255,255,.9);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100%}
.okbar{grid-row:2}
.stage{grid-row:3}
.agbtn{cursor:pointer;color:var(--muted);background:transparent;font:inherit}
.agbtn:hover{border-color:var(--accent);color:var(--fg)}
.agdrop{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:58px;width:min(400px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:12px;display:grid;gap:10px;box-shadow:0 18px 40px rgba(20,35,70,.18);z-index:7}
.agdrop h4{margin:2px 4px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.agcard{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;display:grid;gap:8px;background:var(--surface-2)}
.agcard .agh{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center}
.agcard .agh b{display:block;font-size:13.5px}.agcard .agh small{color:var(--muted);font-size:12px}
.agcard ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
.agcard li{display:flex;gap:7px}.agcard li::before{content:'✓';color:var(--ok);font-weight:700}
.dlabel small i.off{background:#b6bfcd;box-shadow:none}
.dlabel.planned{box-shadow:0 4px 12px rgba(20,35,70,.06)}
.dlabel.planned .ic{background:#dfe4ec;color:#7a869b}
.dlabel.hov{border-color:var(--c);box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
@keyframes bpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,179,64,.6)}50%{box-shadow:0 0 0 6px rgba(255,179,64,0)}}
.badge{animation:bpulse 1.8s infinite}

.hbtn{border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;white-space:nowrap}
#testBtn b{margin-left:6px;font-size:11px;color:var(--muted)}
#testBtn.on{border-color:#f59e0b;background:rgba(245,158,11,.14);color:#fbbf24}
#testBtn.on b{color:#fbbf24}
.hbtn.on{border-color:var(--warn);color:var(--warn)}
.okbar{background:#1f9d4c;color:#fff;font-weight:600;font-size:13px;text-align:center;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.okbar.test{background:#b26b00}
.ract{display:grid;gap:8px}
.abox{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:12px;display:grid;gap:8px}
.abox h3{margin:0;font-size:14.5px}
.abox p{margin:0;font-size:12.5px;color:var(--muted)}
.abox .b{justify-self:start}
.abox .b.wide{justify-self:stretch;text-align:center;padding:9px}
.olist{display:grid;gap:4px}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px;padding:6px 8px;border-radius:8px;background:var(--surface-2)}
.orow .s{font:500 11px var(--mono);border-radius:5px;padding:1px 6px}
.s.open{color:var(--accent);background:rgba(58,168,255,.12)}.s.ok{color:var(--ok);background:rgba(52,227,155,.12)}.s.wait{color:var(--warn);background:rgba(255,179,64,.12)}
.team{display:grid;gap:6px}
.trow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface)}
.trow:hover{border-color:var(--accent)}
.trow .av{width:36px;height:36px;border-radius:50%}
.trow b{display:block;font-size:13.5px}.trow small{color:var(--muted);font-size:12px}
.trow em{font:500 11px var(--mono);font-style:normal;color:#7fdcff}
textarea{width:100%;min-height:62px;resize:vertical;background:var(--bg);color:var(--fg);border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px;position:relative;z-index:5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:#fff}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-family:var(--display);font-weight:800;font-size:21px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand .fr{color:var(--frame)}
.brand span.z{font-weight:600;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:6px}
.stat b{color:var(--fg);font-weight:600}
.stat .g{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.bell{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center}
.bell svg{width:18px;height:18px}
.bell .n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#2a1600;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.drop{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:58px;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:8px;display:grid;gap:4px;box-shadow:0 18px 40px rgba(20,35,70,.18)}
.drop h4{margin:4px 8px 6px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.drop button{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;padding:8px;border-radius:8px}
.drop button:hover{background:var(--surface-2)}
.drop .empty{padding:8px;color:var(--muted);font-size:13px}
.av{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:700 12px var(--display);color:#04101f;flex:none}
.drop b{display:block;font-size:13px}
.drop small{color:var(--muted);font-size:12px}

.stage{position:relative;overflow:hidden;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dlabel,.ptag,.hlabel{position:absolute;left:0;top:0;pointer-events:auto;will-change:transform}
.dlabel{display:flex;align-items:center;gap:9px;transition:opacity .25s,box-shadow .2s;background:#fff;border:1px solid #e6eaf1;border-radius:12px;padding:6px 12px 6px 7px;white-space:nowrap;box-shadow:0 6px 18px rgba(20,35,70,.10)}
.dlabel .ic{width:28px;height:28px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.dlabel b{display:block;font-size:13.5px;font-weight:600;line-height:1.15}
.dlabel small{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.dlabel small i,.ptag em i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.dlabel.dim{opacity:.35}
.badge{background:var(--warn);color:#2a1600;font-size:11px;font-weight:700;border-radius:9px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;margin-left:4px}
.ptag{display:grid;gap:1px;background:#fff;border:1px solid #e6eaf1;box-shadow:0 4px 12px rgba(20,35,70,.10);border-radius:8px;padding:5px 9px;text-align:center;white-space:nowrap;transition:opacity .25s, border-color .2s;backdrop-filter:blur(6px)}
.ptag:hover{border-color:var(--accent)}
.ptag b{font-size:12px;font-weight:600}
.ptag small{font-size:10.5px;color:var(--muted)}
.ptag em{font:500 10.5px var(--mono);font-style:normal;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:5px}
.ptag .badge{position:absolute;top:-8px;right:-8px;margin:0}
.ptag.off,.dlabel.off,.hlabel.off{opacity:0;pointer-events:none}
.hlabel{transition:opacity .25s}
.hlabel{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#3f7bff,#2459e6);border:0;border-radius:99px;padding:7px 15px;box-shadow:0 8px 22px rgba(47,107,255,.35);white-space:nowrap;font-size:12px;pointer-events:none}
.hlabel b{color:#fff;font-weight:600}
.hlabel span{color:rgba(255,255,255,.78);font-weight:400;font-size:11px}

.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;font-size:12px;color:var(--muted);pointer-events:none;background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.zoom{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:70px;display:grid;gap:4px}
.zoom button{width:38px;height:38px;border-radius:10px;background:var(--glass);border:1px solid var(--line-2);display:grid;place-items:center;font-size:20px;line-height:1;text-align:center}
.nav{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.nav-in{display:flex;gap:3px;overflow-x:auto;max-width:100%;background:#fff;border:1px solid #e3e8f0;box-shadow:0 8px 24px rgba(20,35,70,.10);border-radius:12px;padding:4px;scrollbar-width:none;backdrop-filter:blur(6px)}
.nav button{border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav button .d{width:7px;height:7px;border-radius:50%}
.nav button .k{font:500 11px var(--mono);opacity:.7}
.nav button[aria-pressed="true"]{background:#0f1726;color:#fff}

/* Mitarbeiter-Karte */
.card{position:absolute;top:14px;right:max(16px,env(safe-area-inset-right,0px));bottom:14px;width:390px;max-width:calc(100% - 32px);
  background:rgba(255,255,255,.97);border:1px solid #e3e8f0;border-radius:18px;
  box-shadow:0 24px 60px rgba(20,35,70,.18);backdrop-filter:blur(8px);
  overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px;z-index:4;animation:cin .28s ease-out}
@keyframes cin{from{transform:translateX(20px);opacity:0}}
.chead{display:flex;gap:12px;align-items:center}
.chead .av{width:46px;height:46px;border-radius:50%;font-size:15px}
.chead h2{font-family:var(--display);font-size:24px;font-weight:700;margin:0;line-height:1.05}
.chead .role{font-size:12.5px;color:var(--muted)}
.chead .x{margin-left:auto;align-self:flex-start;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;text-align:center}
.eyebrow{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;gap:6px}
.eyebrow i{width:7px;height:7px;border-radius:50%}
.lbl{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line-2);border-radius:7px;padding:3px 9px;background:var(--surface)}
.note{font-size:12px;color:var(--warn);border:1px dashed color-mix(in srgb,var(--warn) 50%,transparent);border-radius:8px;padding:6px 10px}
.agentbox{border:1px solid rgba(58,168,255,.45);background:rgba(58,168,255,.07);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.agenth{display:flex;align-items:center;gap:10px}
.orb{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e6f6ff,#5fc0ff 45%,#1b5fd0);box-shadow:0 0 14px #3aa8ff;flex:none}
.agenth small{display:block;font-size:11px;color:var(--muted)}
.agenth b{font-size:14.5px}
.st{margin-left:auto;font:500 11px var(--mono);color:var(--ok);display:flex;align-items:center;gap:5px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.fuauto{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:start;padding:11px 13px;border-radius:12px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3)}
.fuauto .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);margin-top:4px;box-shadow:0 0 8px var(--ok)}
.fuauto b{font-size:13.5px}.fuauto small{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:2px}
ul.fulog{list-style:none;margin:0;padding:0;display:grid;gap:7px}
ul.fulog li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:9px;align-items:center;font-size:13px}
ul.fulog li small{display:block;font:500 11px var(--mono);color:var(--muted)}
ul.fulog time{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.fic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700}
.fic.ok{background:var(--ok);color:#fff}.fic.wait{background:#eef1f6;color:var(--muted)}
ul.tasks{list-style:none;margin:0;padding:0;display:grid;gap:7px}
ul.tasks li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:9px;align-items:start;font-size:13px}
ul.tasks li .mk{width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:700}
ul.tasks li.active .mk{background:none;border:2px solid var(--muted);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
ul.tasks time{font:500 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.preph{display:flex;align-items:center;gap:8px}
.preph .lbl{margin:0}
.tag-ready{margin-left:auto;font:600 11px var(--body);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 50%,transparent);border-radius:99px;padding:1px 8px}
.items{display:grid;gap:8px}
.item{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:11px 12px;display:grid;gap:8px}
.item.done{opacity:.7}
.itop{display:flex;gap:8px;align-items:flex-start}
.inum{font:500 10.5px var(--mono);color:#fff;background:var(--ok);border-radius:5px;padding:1px 6px;flex:none;margin-top:2px}
.ititle{font-weight:600;font-size:13.5px}
.isub{font-size:12px;color:var(--muted)}
.iprice{margin-left:auto;font-weight:600;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.iacts{display:flex;gap:6px;flex-wrap:wrap}
.b{border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;border:1px solid var(--line-2);background:var(--surface-2)}
.b.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.b.pri:hover{filter:brightness(1.12)}
.b.ghost{border-color:transparent;color:var(--muted);font-weight:500}
.okl{font-size:12.5px;color:var(--ok)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;padding:3px 5px;border-bottom:1px solid var(--line)}
td{padding:5px;border-bottom:1px solid var(--line)}
.r{text-align:right}
td.hi{font-weight:600}
.cfoot{font-size:12px;color:var(--muted);font-style:italic;text-align:center;margin-top:auto;padding-top:6px}

.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;width:min(420px,calc(100% - 32px));
  display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid color-mix(in srgb,var(--warn) 60%,transparent);
  border-radius:14px;padding:10px 12px;box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 24px rgba(255,179,64,.15);animation:tin .35s ease-out}
@keyframes tin{from{transform:translate(-50%,-14px);opacity:0}}
.toast b{display:block;font-size:13px}
.toast small{color:var(--muted);font-size:12px}
.toast .acts{display:flex;gap:4px}

@media (max-width:760px){
  .stats .stat:not(.agbtn){display:none}
  header{gap:8px!important}
  .brand .z{display:none}
  .brand h1{font-size:18px}
  .agbtn .lt{display:none}
  header{flex-wrap:nowrap}
  .brand h1{font-size:18px}
  #testBtn .tl{display:none}
  #testBtn b{margin-left:3px}
  .card.room{max-height:52%}
  .hbtn{padding:6px 8px;font-size:12px}
  .card{top:auto;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:8px;width:auto;max-width:none;max-height:78%;border-radius:18px;animation:cup .28s ease-out}
  @keyframes cup{from{transform:translateY(30px);opacity:0}}
  .stats .stat:nth-child(n+3){display:none}
  .hint{display:none}
  .dlabel{padding:4px 8px 4px 5px;gap:6px}
  .dlabel .ic{width:22px;height:22px;font-size:12px}
  .dlabel b{font-size:12px}
  .dlabel small{display:none}
  .zoom{bottom:66px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.agentbox{background:linear-gradient(180deg,#f6f9ff,#eef4ff)!important;border-color:#dbe6fb!important}
.b.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.zoom button,.hint{box-shadow:0 4px 12px rgba(20,35,70,.08)}
.toast{box-shadow:0 18px 40px rgba(20,35,70,.18)!important}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand"><h1>Neon<span class="fr">Frame</span> <span class="z">Zentrale</span></h1></div>
    <div class="stats" id="stats"></div>
    <button class="bell" id="bell" aria-label="Freigaben"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="n" id="bellN"></span></button>
    <button class="hbtn" id="testBtn">🧪<span class="tl"> Testmodus</span><b>AUS</b></button>
    <button class="hbtn" id="logoutBtn">Abmelden</button>
    <div class="drop" id="drop" hidden></div>
    <div class="agdrop" id="agdrop" hidden></div>
  </header>
  <div class="okbar test" id="okbar" hidden></div>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="3D Büro der NeonFrame Zentrale"></canvas>
    <div class="labels" id="labels"></div>
    <div class="hint">Mausrad zum Zoomen · Ziehen zum Drehen · Abteilung, dann Mitarbeiter anklicken</div>
    <div class="zoom"><button id="zin" aria-label="Hineinzoomen">+</button><button id="zout" aria-label="Herauszoomen">−</button></div>
    <div class="nav"><div class="nav-in" id="nav"></div></div>
    <section class="card" id="card" hidden aria-live="polite"></section>
    <div class="toast" id="toast" hidden></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

function fitDist(w,h){ const asp=Math.max(.3,(stage.clientWidth||1)/(stage.clientHeight||1)), tv=Math.tan(cam.fov*Math.PI/360); return Math.max(h/2/tv, w/2/(tv*asp)); }

function cardShift(dd){ if(stage.clientWidth<=760) return; const asp=stage.clientWidth/stage.clientHeight, visH=2*dd*Math.tan(cam.fov*Math.PI/360), visW=visH*asp; goal.add(new THREE.Vector3(Math.cos(thetaGoal),0,-Math.sin(thetaGoal)).multiplyScalar(visW*Math.min(.24,190/stage.clientWidth))); }

  const asp=W/H; distGoal=isMob()?5.4:4.6; thetaGoal=nearTheta(Math.PI/4-.45); phiGoal=1.12;
  const visH=2*distGoal*Math.tan(cam.fov*Math.PI/360), visW=visH*asp;

  card.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>goTab(b.dataset.nav));
  const fuBtn=(b,msg)=>{ b.disabled=true; b.textContent='Wird gesendet...'; post(msg); };
  card.querySelectorAll('[data-fu]').forEach(b=>b.onclick=()=>fuBtn(b,{ type: 'nf-fu', action: 'send', id: b.dataset.fu }));
  card.querySelectorAll('[data-fuskip]').forEach(b=>b.onclick=()=>fuBtn(b,{ type: 'nf-fu', action: 'skip', id: b.dataset.fuskip }));
  card.querySelectorAll('[data-fuall]').forEach(b=>b.onclick=()=>{ if(!confirm(`Alle ${(DATA.fu?.approve||[]).length} Mails jetzt senden?`)) return; fuBtn(b,{ type: 'nf-fu', action: 'all' }); });
  card.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>post({ type: 'nf-open', id: b.dataset.open }));
  card.querySelectorAll('[data-dismiss]').forEach(b=>b.onclick=()=>{ post({ type: 'nf-dismiss', id: b.dataset.dismiss }); DATA.tasks = DATA.tasks.filter(t => t.id !== b.dataset.dismiss); updateBadges(); renderCard(); });
}

/* ================= Meldungen (echte fällige Angebote) ================= */
const bellN=document.getElementById('bellN'), drop=document.getElementById('drop'), toast=document.getElementById('toast');
function updateBadges(){
  const n=DATA.due.length, a=offerTasks().length, u=updTasks().length, all=n+a+u;
  bellN.textContent=all; bellN.hidden=!all;
  const setB=(el,v)=>{ const b=el.querySelector('.badge'); b.textContent=v; b.hidden=!v; };
  setB(DEPTS[5]._lbl, n); setB(EMMA._tag, n);
  setB(DEPTS[0]._lbl, a+u); setB(LISA._tag, a); setB(TOM._tag, u);
  okbar.hidden = !n;
  okbar.textContent = DATA.fu ? `● ${DATA.fu.approve.length} ${DATA.fu.approve.length===1?'Rabatt-Mail wartet':'Rabatt-Mails warten'} auf deine Freigabe →` : `● ${n} ${n===1?'Angebot wartet':'Angebote warten'} auf Nachfassen →`; okbar.style.cursor='pointer';
  if (typeof onResize === 'function') requestAnimationFrame(onResize);
  if(!drop.hidden) renderDrop();
}
okbar.onclick=()=>{ if (DATA.due.length) openPerson(EMMA) };
function renderDrop(){
  const rows=[
    ...offerTasks().map(t=>({p:LISA,c:DEPTS[0].color,i:'LF',t:`Neues Angebot · ${t.name}`,s:'Lisa Fischer · Angebots-Agent'})),
    ...updTasks().map(t=>({p:TOM,c:DEPTS[0].color,i:'TB',t:`Änderung · ${t.name}`,s:'Tom Becker · Änderungs-Agent'})),
    ...DATA.due.map(o=>({p:EMMA,c:DEPTS[5].color,i:'EK',t:`${o.nr} · ${o.name}`,s:o.status})),
  ];
  drop.innerHTML=`<h4>Wartet auf dich</h4>`+(rows.length?rows.map((r,k)=>`<button data-k="${k}"><span class="av" style="background:${r.c}">${r.i}</span><span><b>${esc(r.t)}</b><small>${esc(r.s)}</small></span></button>`).join(''):`<div class="empty">Alles erledigt. Nichts offen.</div>`);
  drop.querySelectorAll('button').forEach(b=>b.onclick=()=>{drop.hidden=true;openPerson(rows[+b.dataset.k].p);});
}
document.getElementById('bell').onclick=e=>{e.stopPropagation(); drop.hidden=!drop.hidden; if(!drop.hidden) renderDrop();};
document.addEventListener('click',e=>{ if(!drop.hidden && !drop.contains(e.target)) drop.hidden=true; if(!agdrop.hidden && !agdrop.contains(e.target) && !e.target.closest('#agbtn')) agdrop.hidden=true; });
const agdrop=document.getElementById('agdrop');
function renderAgents(){
  agdrop.innerHTML = `<h4>Aktive Agenten · ${ACTIVE.length}</h4>` + ACTIVE.map((p,k)=>`<div class="agcard">
    <div class="agh"><span class="av" style="background:${p.dept0.color}">${ini(p.name)}</span><span><b>${p.agent}</b><small>${p.name} · ${p.dept0.name}</small></span><button class="b" data-ag="${k}">Ansehen</button></div>
    <ul>${AGENT_INFO[p.agent].tasks.map(t=>`<li>${t}</li>`).join('')}</ul></div>`).join('');
  agdrop.querySelectorAll('[data-ag]').forEach(b=>b.onclick=()=>{ agdrop.hidden=true; openPerson(ACTIVE[+b.dataset.ag]); });
}
document.getElementById('stats').addEventListener('click', e => { if (!e.target.closest('#agbtn')) return; e.stopPropagation(); drop.hidden=true; agdrop.hidden=!agdrop.hidden; if(!agdrop.hidden) renderAgents(); });
let toastT=null, toastShown=false;
function showToast(title,sub,who,ini2){
  who = who || EMMA;
  toast.innerHTML=`<span class="av" style="background:${who.dept.color}">${ini2||'EK'}</span><span><b>${title}</b><small>${sub}</small></span><span class="acts"><button class="b pri" id="tgo">Ansehen</button><button class="b ghost" id="tx" aria-label="Schließen">×</button></span>`;
  toast.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>toast.hidden=true,10000);
  toast.querySelector('#tgo').onclick=()=>{toast.hidden=true;openPerson(who);};
  toast.querySelector('#tx').onclick=()=>toast.hidden=true;
}
window.addEventListener('message', (e) => {
  if (e.origin !== window.location.origin || e.data?.type !== 'nf-data') return;
  const before = new Set(DATA.tasks.map(t => t.id));
  DATA = { orders: e.data.orders || [], due: e.data.due || [], tasks: e.data.tasks || [], fu: e.data.fu, stats: e.data.stats || DATA.stats };
  const fresh = DATA.tasks.filter(t => !before.has(t.id));
  renderStats(); updateBadges();
  if (openP) renderCard(); else if (focused && !card.hidden) renderRoom(focused);
  const nt = toastShown ? fresh : DATA.tasks;
  if (nt.length) { toastShown = true; const o = nt.filter(t=>t.type==='offer').length, u = nt.length - o;
    showToast(o ? `${o} ${o===1?'neues Angebot':'neue Angebote'} zum Freigeben` : `${u} ${u===1?'Änderung':'Änderungen'} von Kenzo`, o ? 'Lisa Fischer · Angebots-Agent' : 'Tom Becker · Änderungs-Agent', o ? LISA : TOM, 'LF'); }
  else if (!toastShown && DATA.due.length) { toastShown = true; showToast(`${DATA.due.length} ${DATA.due.length===1?'Angebot wartet':'Angebote warten'} auf dich`, 'Emma Koch · Follow-up-Agent', EMMA, 'EK'); }
});
post({ type: 'nf-ready' });

/* ================= Kamera, Zoom, Ziehen ================= */
let W=1,H=1;
function resize(){ W=stage.clientWidth; H=stage.clientHeight; renderer.setSize(W,H,false);
  cam.aspect=W/H; cam.updateProjectionMatrix();
  distGoal = openP ? distGoal : focused ? roomDist() : overDist(); }
new ResizeObserver(resize).observe(stage); resize();

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function setNdc(x,y){const r=canvas.getBoundingClientRect(); ndc.set(((x-r.left)/r.width)*2-1,-((y-r.top)/r.height)*2+1);}
let tw=null; const easeIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function flyTo(dur){ const p1=goal.clone(); tw={t0:performance.now(),dur:reduce?1:(dur||1600),p0:target.clone(),p1,d0:dist,d1:distGoal,th0:theta,th1:thetaGoal,ph0:phi,ph1:phiGoal,arc:Math.min(16,target.distanceTo(p1)*.45)}; }
function nearTheta(a){ let d=((a-theta)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI; return theta+d; }
function syncCam(){
  OFFSET.set(Math.sin(phi)*Math.sin(theta), Math.cos(phi), Math.sin(phi)*Math.cos(theta)).multiplyScalar(dist);
  cam.position.copy(target).add(OFFSET); cam.lookAt(target); cam.updateMatrixWorld(); }
function zoomBy(f){ if(tw){ distGoal=dist; goal.copy(target); thetaGoal=theta; phiGoal=phi; tw=null; } distGoal=Math.min(140,Math.max(4.5,distGoal*f)); }
stage.addEventListener('wheel',e=>{ if(e.target.closest('.card,.drop,.agdrop')) return; e.preventDefault(); zoomBy(Math.exp(e.deltaY*.0012)); },{passive:false});
document.getElementById('zin').onclick=()=>zoomBy(1/1.35);
document.getElementById('zout').onclick=()=>zoomBy(1.35);

const ptrs=new Map(); let dragPt=null, moved=0, pinch=null, downAt=null, lastP=null;
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ dragPt=true; moved=0; downAt=[e.clientX,e.clientY]; lastP=[e.clientX,e.clientY]; }
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}; dragPt=null; moved=99; }
});
canvas.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2 && pinch){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); zoomBy(pinch.d/d); pinch.d=d; return; }
  if(ptrs.size===1 && dragPt){
    moved=Math.max(moved,Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]));
    if(moved>5){ if(tw){ distGoal=dist; goal.copy(target); thetaGoal=theta; phiGoal=phi; tw=null; } const dx=e.clientX-lastP[0], dy=e.clientY-lastP[1];
      thetaGoal-=dx*.006; phiGoal=Math.min(1.35,Math.max(.45,phiGoal-dy*.004)); canvas.style.cursor='grabbing'; }
    lastP=[e.clientX,e.clientY];
    return;
  }
  setNdc(e.clientX,e.clientY); ray.setFromCamera(ndc,cam); const h=ray.intersectObjects(pickables)[0];
  canvas.style.cursor=h?'pointer':'grab';
  const hd=h?(h.object.userData.d||h.object.userData.p?.dept):null; setHov(hd);
});
function endPtr(e){
  const wasClick = ptrs.size===1 && moved<=5 && dragPt;
  ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; canvas.style.cursor='grab';
  if(wasClick){ setNdc(e.clientX,e.clientY); ray.setFromCamera(ndc,cam); const h=ray.intersectObjects(pickables)[0];
    if(h){ const u=h.object.userData; if(u.type==='agent'){ openPerson(u.p); } else if(u.type==='room') focusRoom(u.d.id); } }
  if(!ptrs.size) dragPt=null;
}
canvas.addEventListener('pointerleave',()=>{ if(!dragPt) setHov(null); });
canvas.addEventListener('pointerup',endPtr); canvas.addEventListener('pointercancel',endPtr);
addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(openP) closeCard(); else overview(); } });

/* ================= Loop ================= */
const v=new THREE.Vector3(), tmp=new THREE.Vector3(), clock=new THREE.Clock();
function place(el,pos){ v.copy(pos).project(cam); const x=(v.x+1)/2*W, y=(1-v.y)/2*H;
  const off = x<-200||x>W+200||y<-100||y>H+100; el.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%)`; return !off; }
function frame(){
  const t=clock.getElapsedTime();
  if(tw){ const u=Math.min(1,(performance.now()-tw.t0)/tw.dur), e=easeIO(u);
    target.lerpVectors(tw.p0,tw.p1,e); dist=tw.d0+(tw.d1-tw.d0)*e+Math.sin(Math.PI*e)*tw.arc; theta=tw.th0+(tw.th1-tw.th0)*e; phi=tw.ph0+(tw.ph1-tw.ph0)*e;
    if(u>=1) tw=null; }
  else { const k=reduce?1:.09; target.lerp(goal,k); dist+=(distGoal-dist)*k; theta+=(thetaGoal-theta)*(reduce?1:.12); phi+=(phiGoal-phi)*(reduce?1:.12); }
  syncCam();
  if(!reduce){
    globe.rotation.y=Math.sin(t*.25)*.55; globe.position.y=4.6+Math.sin(t*.8)*.08;
    tower.forEach((r,i)=>{ r.position.y=1.2+i*1.1+Math.sin(t*1.4+i)*.15; r.scale.setScalar(1+Math.sin(t*2+i)*.05); });
    crystal.rotation.y=crystalW.rotation.y=t*.5; core.position.y=3.1+Math.sin(t*1.2)*.15; ringC.rotation.z=-t*.3; ringB.rotation.z=t*.1;
    orbits.forEach(o=>o.e.position.set(Math.cos(t*o.sp)*o.r,Math.sin(t*o.sp)*o.r,0));
    logo.position.y=7.4+Math.sin(t*.9)*.12; logo.material.opacity=.88+Math.sin(t*3.1)*.06+(Math.random()<.01?-.4:0);
    const dt=Math.min(.05,t-(frame.lt||t)); frame.lt=t;
    for(let k=0;k<PN;k++){ pPos[k*3+1]+=pSpd[k]*dt; if(pPos[k*3+1]>7) pPos[k*3+1]=.4; } pGeo.attributes.position.needsUpdate=true;
  }
  spinners.forEach(o=>{ o.rotation.y=t*.8; o.rotation.x=t*.4; });
  DEPTS.forEach(d=>{ const rm=rooms[d.id]; const cd=cam.position.clone().sub(rm.g.position).setY(0).normalize();
    rm.walls.forEach(w=>{ const goalO=w.n.dot(cd)>.12?0:1; w.o+=(goalO-w.o)*(reduce?1:.14); const o=w.o; w.m.opacity=o; w.tm.opacity=o; w.m.depthWrite=o>.95; w.objs.forEach(x=>{ x.visible=o>.03; if(x!==w.objs[0]&&x!==w.objs[1]&&x.material){ x.material.transparent=true; x.material.opacity=o; } }); });
    const hy=0; rm.g.position.y+=(hy-rm.g.position.y)*(reduce?1:.15); });
  DEPTS.forEach(d=>{ const r=rooms[d.id]; r.pulse.position.lerpVectors(r.from,r.to,reduce?.5:((t*.3+r.ph)%1));
    place(d._lbl, tmp.copy(r.g.position).add(new THREE.Vector3(-1.5,3.6,-3.6))); d._lbl.classList.toggle('off',!!openP||(!!focused&&d.id!==focused)); });
  place(hubLbl, new THREE.Vector3(0,8.2,0)); hubLbl.classList.toggle('off',!!focused);
  const showTags = dist<30;
  persons.forEach(p=>{
    const work=(p===LISA&&offerTasks().length)||(p===TOM&&updTasks().length)||(p===EMMA&&DATA.due.length);
    if(!reduce&&p.arms){ p.arms[0].rotation.x=Math.sin(t*9+p.ph)*.035; p.arms[1].rotation.x=Math.sin(t*9+p.ph+1.7)*.035; p.headY.rotation.x=Math.sin(t*.7+p.ph)*.06; }
    const sc=work?1+Math.sin(t*5)*.18:1; p.orb.scale.setScalar(sc); p.orb.material.color.setHex(work?0xffb340:0x5b9bff); p.orb.material.emissive.setHex(work?0xf59e0b:0x2f6bff); p.og.material.color.setHex(work?0xffb340:0x3aa8ff);
    const y=2.45+(reduce?0:Math.sin(t*1.8+p.ph)*.08);
    p.orb.position.y=p.og.position.y=p.r1.position.y=p.r2.position.y=y;
    if(!reduce){ p.r1.rotation.z=t; p.r2.rotation.y=t*1.4; }
    tmp.copy(p.local); p.room.localToWorld(tmp);
    const ok=place(p._tag,tmp); p._tag.classList.toggle('off',!(showTags&&ok&&(!focused||p.dept.id===focused)&&(!openP||p===openP)));
  });
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
distGoal=overDist(); phi=phiGoal=overPhi(); dist=distGoal*1.9; goal.set(0,1.5,0); target.copy(goal);
updateBadges(); syncCam(); frame();
if(document.fonts) document.fonts.ready.then(()=>[logoTex,...DEPTS.flatMap(d=>[d._tex,d._scr,d._sign].filter(Boolean))].forEach(t=>{const c=t.userData.c;t.userData.draw(c.getContext('2d'),c.width,c.height);t.needsUpdate=true;}));
</script>
